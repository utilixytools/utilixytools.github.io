<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetFlow - UtilixyTools</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #061712;
      --card-bg: rgba(14, 35, 27, 0.7);
      --card-border: rgba(52, 211, 153, 0.15);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --text-sub: #9ca3af;
      --input-bg: #0a2018;
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(at 10% 10%, rgba(16, 185, 129, 0.12) 0px, transparent 50%), radial-gradient(at 90% 90%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      display: flex; justify-content: space-between; align-items: center; padding: 20px 8%;
      border-bottom: 1px solid var(--card-border); backdrop-filter: blur(12px); background: rgba(6, 23, 18, 0.8);
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--accent-color); }

    .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .tool-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 28px; backdrop-filter: blur(10px);
    }

    .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-box { background: rgba(6, 23, 18, 0.5); padding: 18px; border-radius: 12px; border: 1px solid var(--card-border); }
    .stat-box label { font-size: 12px; color: var(--text-sub); display: block; }
    .stat-box .val { font-size: 20px; font-weight: 700; color: var(--text-main); margin-top: 4px; }

    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .input-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-main); outline: none; }

    .btn { background: var(--accent-color); color: #04120e; padding: 12px; width: 100%; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .progress-bar-bg { background: var(--input-bg); height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid var(--card-border); }
    .progress-bar-fill { background: var(--accent-color); height: 100%; width: 0%; transition: width 0.3s; }

    .expense-list { list-style: none; margin-top: 16px; }
    .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(6, 23, 18, 0.4); border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 8px; }
    .del-btn { color: #ef4444; cursor: pointer; background: none; border: none; font-size: 14px; }

    footer { text-align: center; padding: 40px; color: var(--text-sub); font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-screwdriver-wrench"></i> Utilixy<span>Tools</span>
    </a>
  </header>

  <main class="container">
    <div style="margin-bottom: 24px;">
      <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-size: 14px; font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
      <h1 style="font-size: 32px; font-weight: 800; margin-top: 12px;">BudgetFlow</h1>
      <p style="color: var(--text-sub);">Manage your monthly budget and expenses seamlessly.</p>
    </div>

    <div class="stat-cards">
      <div class="stat-box">
        <label>Total Income</label>
        <div class="val" id="incomeVal">$0.00</div>
      </div>
      <div class="stat-box">
        <label>Total Expenses</label>
        <div class="val" id="expenseVal">$0.00</div>
      </div>
      <div class="stat-box">
        <label>Remaining Balance</label>
        <div class="val" id="balanceVal" style="color: var(--accent-color);">$0.00</div>
      </div>
    </div>

    <div class="grid">
      <!-- Controls Panel -->
      <div class="tool-card">
        <h3 style="margin-bottom: 16px;">Set Budget</h3>
        <div class="input-group">
          <label>Monthly Income ($)</label>
          <input type="number" id="incomeInput" placeholder="5000">
        </div>
        <button class="btn" onclick="updateIncome()" style="margin-bottom: 24px;">Update Income</button>

        <h3 style="margin-bottom: 16px;">Add Expense</h3>
        <div class="input-group">
          <label>Expense Name</label>
          <input type="text" id="expName" placeholder="Groceries">
        </div>
        <div class="input-group">
          <label>Amount ($)</label>
          <input type="number" id="expAmount" placeholder="150">
        </div>
        <button class="btn" onclick="addExpense()">Add Expense</button>
      </div>

      <!-- Overview Panel -->
      <div class="tool-card">
        <h3>Budget Usage</h3>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <h3 style="margin-top: 28px; margin-bottom: 12px;">Expense History</h3>
        <ul class="expense-list" id="expenseList">
          <!-- Expenses render dynamically -->
        </ul>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 UtilixyTools. All rights reserved.</p>
  </footer>

  <script>
    let income = parseFloat(localStorage.getItem('bf_income')) || 0;
    let expenses = JSON.parse(localStorage.getItem('bf_expenses')) || [];

    function init() {
      document.getElementById('incomeInput').value = income || '';
      render();
    }

    function updateIncome() {
      income = parseFloat(document.getElementById('incomeInput').value) || 0;
      localStorage.setItem('bf_income', income);
      render();
    }

    function addExpense() {
      const name = document.getElementById('expName').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value) || 0;
      if (name && amount > 0) {
        expenses.push({ id: Date.now(), name, amount });
        localStorage.setItem('bf_expenses', JSON.stringify(expenses));
        document.getElementById('expName').value = '';
        document.getElementById('expAmount').value = '';
        render();
      }
    }

    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      localStorage.setItem('bf_expenses', JSON.stringify(expenses));
      render();
    }

    function render() {
      const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
      const balance = income - totalExpenses;
      const pct = income > 0 ? Math.min((totalExpenses / income) * 100, 100) : 0;

      document.getElementById('incomeVal').textContent = '$' + income.toFixed(2);
      document.getElementById('expenseVal').textContent = '$' + totalExpenses.toFixed(2);
      document.getElementById('balanceVal').textContent = '$' + balance.toFixed(2);
      document.getElementById('progressFill').style.width = pct + '%';

      const listEl = document.getElementById('expenseList');
      listEl.innerHTML = expenses.map(e => `
        <li class="expense-item">
          <span>${e.name}</span>
          <div>
            <strong style="margin-right: 12px;">$${e.amount.toFixed(2)}</strong>
            <button class="del-btn" onclick="deleteExpense(${e.id})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </li>
      `).join('');
    }

    init();
  </script>
</body>
</html>
