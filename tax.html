<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quebec Tax Calculator - UtilixyTools</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .calculator-card {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .results-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .result-row.total {
      font-weight: bold;
      font-size: 18px;
      border-top: 2px solid #ddd;
      padding-top: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">
      <i class="fa-solid fa-wrench"></i> Utilixy<span>Tools</span>
    </a>
    <nav>
      <a href="index.html">Tools</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="calculator-card">
      <h1><i class="fa-solid fa-calculator"></i> Quebec Tax Calculator</h1>
      <p>Calculate GST (5%) and QST (9.975%) or extract tax amounts from total prices instantly.</p>

      <div class="form-group">
        <label for="calc-mode">Calculation Mode</label>
        <select id="calc-mode" onchange="calculateTax()">
          <option value="add">Add Tax to Subtotal</option>
          <option value="extract">Extract Tax from Total</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount" id="amount-label">Subtotal Amount ($)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" oninput="calculateTax()">
      </div>

      <div class="results-box">
        <div class="result-row">
          <span>Subtotal (Net):</span>
          <span id="res-subtotal">$0.00</span>
        </div>
        <div class="result-row">
          <span>GST / TPS (5%):</span>
          <span id="res-gst">$0.00</span>
        </div>
        <div class="result-row">
          <span>QST / TVQ (9.975%):</span>
          <span id="res-qst">$0.00</span>
        </div>
        <div class="result-row total">
          <span>Total Amount:</span>
          <span id="res-total">$0.00</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 UtilixyTools. All rights reserved.</p>
  </footer>

  <script>
    function calculateTax() {
      const mode = document.getElementById('calc-mode').value;
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const amountLabel = document.getElementById('amount-label');

      const GST_RATE = 0.05;
      const QST_RATE = 0.09975;
      const TOTAL_TAX_RATE = GST_RATE + QST_RATE; // 0.14975

      let subtotal = 0;
      let gst = 0;
      let qst = 0;
      let total = 0;

      if (mode === 'add') {
        amountLabel.innerText = "Subtotal Amount ($)";
        subtotal = amount;
        gst = subtotal * GST_RATE;
        qst = subtotal * QST_RATE;
        total = subtotal + gst + qst;
      } else {
        amountLabel.innerText = "Total Amount ($)";
        total = amount;
        subtotal = total / (1 + TOTAL_TAX_RATE);
        gst = subtotal * GST_RATE;
        qst = subtotal * QST_RATE;
      }

      document.getElementById('res-subtotal').innerText = '$' + subtotal.toFixed(2);
      document.getElementById('res-gst').innerText = '$' + gst.toFixed(2);
      document.getElementById('res-qst').innerText = '$' + qst.toFixed(2);
      document.getElementById('res-total').innerText = '$' + total.toFixed(2);
    }
  </script>
</body>
</html>
